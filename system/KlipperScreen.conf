[printer VyperOS]
titlebar_name_type: full

[main]
use_default_menu: False

# ==============
# Menu principal
# ==============
[menu __main]
name: {{ gettext('Main Menu') }}

[menu __main move]
name: {{ gettext('Move') }}
icon: move
panel: move

[menu __main temperature]
name: {{ gettext('Temperature') }}
icon: heat-up
panel: temperature
enable: {{ (printer.temperature_devices.count > 0) or (printer.extruders.count > 0) }}

[menu __main extrude]
name: {{ gettext('Extrude') }}
icon: extrude
panel: extrude
enable: {{ printer.extruders.count > 0 }}

[menu __main more]
name: Menu
icon: settings

[menu __main print]
name: {{ gettext('Print') }}
icon: printer
panel: gcodes
enable: {{ printer.extruders.count > 0 }}

[menu __main gcodes]
name: {{ gettext('Gcodes') }}
icon: files
panel: gcodes
enable: {{ printer.extruders.count == 0 }}

# =========
# Sous-menu
# =========

[menu __main more bedmesh]
name: {{ gettext('Bed Mesh') }}
icon: bed-mesh
panel: bed_mesh
enable: {{ 'bed_mesh' in printer.config_sections }}

[menu __main more limits]
name: {{ gettext('Limits') }}
icon: fine-tune
panel: limits

[menu __main more fine_tune]
name: Réglages fins
icon: fine-tune
panel: fine_tune

[menu __main more fan]
name: {{ gettext('Fan') }}
icon: fan
panel: fan
enable: {{ printer.fans.count > 0 }}

[menu __main more led]
name: {{ gettext('Leds') }}
icon: light
panel: led
enable: {{ printer.leds.count > 0 }}

[menu __main more input_shaper]
name: {{ gettext('Input Shaper') }}
icon: move
panel: input_shaper
enable: {{ 'input_shaper' in printer.config_sections }}

[menu __main more network]
name: {{ gettext('Network') }}
icon: network
panel: network

[menu __main more console]
name: {{ gettext('Console') }}
icon: console
panel: console

[menu __main more updater]
name: Mise à jour
icon: refresh
panel: updater

[menu __main more settings]
name: Paramètres
icon: settings
panel: settings

[menu __main more networkcfg]
name: Configuration IP
icon: network
panel: networkcfg

[menu __main more system]
name: {{ gettext('System') }}
icon: info
panel: system
enable: {{ moonraker_connected }}

